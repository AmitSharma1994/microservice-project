apiVersion: v1
kind: Namespace
metadata:
  name: microservices
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: microservices
data:
  EUREKA_DEFAULT_ZONE: "http://eureka-server:8761/eureka/"
  EUREKA_DASHBOARD_URL: "http://eureka-server:8761"
  ZIPKIN_ENDPOINT: "http://zipkin.monitoring:9411/api/v2/spans"
  KAFKA_BOOTSTRAP_SERVERS: "b-1.kafka.your-domain.amazonaws.com:9092"
  REDIS_HOST: "redis-cluster.your-domain.cache.amazonaws.com"
  REDIS_PORT: "6379"
  USER_DB_URL: "jdbc:mysql://user-db.your-domain.rds.amazonaws.com:3306/user_db"
  USER_DB_USERNAME: "userservice"
  ORDER_DB_URL: "jdbc:mysql://order-db.your-domain.rds.amazonaws.com:3306/order_db"
  ORDER_DB_USERNAME: "orderservice"
  PRODUCT_DB_URL: "jdbc:mysql://product-db.your-domain.rds.amazonaws.com:3306/product_db"
  PRODUCT_DB_USERNAME: "productservice"
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: microservices
type: Opaque
stringData:
  USER_DB_PASSWORD: "replace-me"
  ORDER_DB_PASSWORD: "replace-me"
  PRODUCT_DB_PASSWORD: "replace-me"
  JWT_SECRET: "replace-me-with-strong-hex-or-base64"

